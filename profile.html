<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body class="">
    <header>
      <h1 class="quiz-title">Quiz App</h1>
    </header>
    <main>
      <section class="card">
        <div class="profile_top_container">
          <div class="profile_img">
            <div
              style="
                padding: 10px;
                background-color: #f4bd3478;
                border-radius: 50%;
                width: 60px;
                height: 50x;
              "
            >
              <img src="./img/profile_filled.png" style="width: 60px" />
            </div>
          </div>
          <div class="profile_name">
            <h3>Mustafa Mohammady</h3>
          </div>
        </div>
        <div class="about_me_container">
          <h3>ABOUT ME</h3>
          <br />
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem ut
            blanditiis ab numquam nihil, dignissimos molestias. Reprehenderit,
            vero quisquam architecto quod eum odio quaerat explicabo
            necessitatibus repellat in, doloribus expedita?
          </p>
        </div>
        <div class="profile_bottom_container">
          <button type="button">
            <i class="fa-solid fa-file-circle-question"></i>
            12
          </button>
          <button type="button">
            <i class="fas fa-bookmark"></i>
            4
          </button>
        </div>
      </section>
      <section class="card switch_card">
        <h2 style="width: 100%; text-align: left">Settings</h2>
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: start;
            width: 100%;
            margin-top: 20px;
          "
        >
          <p>Dark Mode</p>
          <input type="checkbox" id="theme-toggle" data-js="themeToggle" />
          <label for="theme-toggle" class="switch"></label>
        </div>
      </section>
    </main>
    <footer>
      <ul class="mobile-menu">
        <li>
          <a href="index.html">
            <span class="fas fa-home menu-icon"></span>
          </a>
        </li>
        <li>
          <a href="bookmarks.html">
            <span class="fas fa-bookmark menu-icon"></span>
          </a>
        </li>
        <li>
          <a href="newQuestion.html">
            <span class="fas fa-plus menu-icon"></span>
          </a>
        </li>
        <li class="active">
          <a href="profile.html">
            <span class="fas fa-user menu-icon"></span>
          </a>
        </li>
      </ul>
    </footer>
  </body>
  <script src="./js/index.js"></script>
</html>
